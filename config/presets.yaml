# scipick configuration. Copy and adjust, then run:
#   python -m scipick --presets-file config/presets.yaml
#
# Every preset is a view over the same metric set. `rank_by` is either:
#   score       - rank by weighted ability (0-100)
#   efficiency  - rank by ability per blended dollar
#
# Available metric keys (from the Artificial Analysis data API):
#   scicode                                     SciCode (0-1)
#   hle                                         Humanity's Last Exam (0-1)
#   artificial_analysis_intelligence_index      AA Intelligence Index (0-100)
#   lcr                                         Long-context reasoning (0-1)
#   terminalbench_v4_0                          Terminal-Bench 4.0 (0-1)
#
# Weights are renormalised, so they need not sum to 1. A metric missing for a
# given model is skipped and the rest renormalised; the reported coverage tells
# you how much of the weighting landed.
#
# ---------------------------------------------------------------------------
# Three filters decide who appears on a board. All three exist because a
# leaderboard over *every* model ever released is dominated by tiny, cheap,
# superseded entries that are irrelevant to picking a model for real work.
#
# 1. Latest generation only (global, in scipick/curate.py).
#    "Claude Opus 4.5" through "Opus 5.5" are all in the catalogue. Six rows for
#    one product line is noise when you want the state of the art, so only the
#    newest version of each line is kept.
#
# 2. min_coverage -- enough benchmarks to be comparable.
#    SciCode and Terminal-Bench cover about a third of the catalogue, so without
#    a floor the coding view ranks models on long-context reasoning alone.
#
# 3. min_relative_score -- the frontier gate.
#    A model must reach this fraction of the best score *in this view* to be
#    ranked. This is what stops the value board being topped by 4B models: a
#    model can be 400 points-per-dollar and still be the wrong tool, and a pure
#    ratio has no way to express that. Set 0 to disable.
# ---------------------------------------------------------------------------

presets:
  # Absolute ability, price ignored.
  capability:
    label: Capability
    description: Absolute ability, price ignored.
    rank_by: score
    min_coverage: 0.5
    min_relative_score: 0.0     # this board *is* the frontier
    weights:
      scicode: 0.40
      hle: 0.20
      artificial_analysis_intelligence_index: 0.20
      lcr: 0.10
      terminalbench_v4_0: 0.10

  # Ability per blended dollar, among models worth using.
  #
  # min_relative_score is the important line here. Without it the board is won
  # by 3-4B models scoring ~20/100 at $0.04/1M: technically the best ratio,
  # practically useless. At 0.65 the cheapest entrants are still near-frontier
  # small models (Claude Haiku, MiMo Flash class) rather than toys.
  value:
    label: Value
    description: Ability per dollar, among models within reach of the frontier.
    rank_by: efficiency
    min_coverage: 0.5
    min_relative_score: 0.65
    weights:
      scicode: 0.40
      hle: 0.20
      artificial_analysis_intelligence_index: 0.20
      lcr: 0.10
      terminalbench_v4_0: 0.10

  # Code generation and agentic terminal work.
  #
  # min_coverage is high on purpose: SciCode and Terminal-Bench cover roughly a
  # third of the catalogue, so a lower floor lets a model be ranked on
  # long-context reasoning alone -- a coding board sorted by the wrong benchmark.
  coding:
    label: Coding
    description: Weighted toward code generation and terminal execution.
    rank_by: score
    min_coverage: 0.85
    min_relative_score: 0.0
    weights:
      scicode: 0.60
      terminalbench_v4_0: 0.25
      lcr: 0.15

  # Long-document work: papers, specs, codebases.
  longcontext:
    label: Long context
    description: For whole-repository or long-document reasoning.
    rank_by: score
    min_coverage: 0.5
    min_relative_score: 0.6
    weights:
      lcr: 0.50
      scicode: 0.25
      artificial_analysis_intelligence_index: 0.25
